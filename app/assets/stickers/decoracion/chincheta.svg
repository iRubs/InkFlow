<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Shadow of pin -->
  <ellipse cx="85" cy="165" rx="35" ry="12" fill="#0F172A" opacity="0.25" filter="url(#pinShadow)"/>
  <!-- Metallic needle -->
  <polygon points="98,110 102,110 85,165" fill="#94A3B8" stroke="#64748B" stroke-width="1"/>
  <!-- Red pushpin body -->
  <circle cx="100" cy="70" r="38" fill="url(#pinGrad)" filter="url(#pinShadow)"/>
  <ellipse cx="100" cy="50" rx="28" ry="14" fill="#FCA5A5" opacity="0.8"/>
  <circle cx="95" cy="45" r="8" fill="#FFFFFF" opacity="0.7"/>
  <path d="M78 80 C85 96 115 96 122 80 C120 110 80 110 78 80 Z" fill="#991B1B"/>
</svg>
