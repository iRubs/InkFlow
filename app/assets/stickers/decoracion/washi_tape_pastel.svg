<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <filter id="tapeShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
    <pattern id="diagonalStripe" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
