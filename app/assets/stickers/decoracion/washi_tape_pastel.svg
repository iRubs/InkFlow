  <path d="M10 20 L15 25 L10 30 L15 35 L10 40 L15 45 L10 50 L15 55 L10 60 L190 60 L185 55 L190 50 L185 45 L190 40 L185 35 L190 30 L185 25 L190 20 Z" 
